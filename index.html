<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="THRIVE, Offshore Services, Offshore Staffing, Outsourcing" />
    <meta name="description" content="THRIVE - Offshore Services" />
    <title>THRIVE - Offshore Services</title>
    <link rel="canonical" href="https://mhbelderol.github.io/thrive-web/" />

    <!-- Open Graph (link previews on Facebook, LinkedIn, Slack, Discord, iMessage, WhatsApp, ...).
         Crawlers don't run JS, so these must be static here. URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THRIVE" />
    <meta property="og:title" content="THRIVE - Offshore Services" />
    <meta property="og:description" content="THRIVE - Offshore Services" />
    <meta property="og:url" content="https://mhbelderol.github.io/thrive-web/" />
    <meta property="og:image" content="https://mhbelderol.github.io/thrive-web/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The THRIVE team" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THRIVE - Offshore Services" />
    <meta name="twitter:description" content="THRIVE - Offshore Services" />
    <meta name="twitter:image" content="https://mhbelderol.github.io/thrive-web/og-image.jpg" />
    <meta name="twitter:image:alt" content="The THRIVE team" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
